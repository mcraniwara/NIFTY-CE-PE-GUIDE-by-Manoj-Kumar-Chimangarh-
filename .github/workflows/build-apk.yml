name: Build NIFTY CE PE Guide APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: |
          unzip -o NIFTY_CE_PE_GUIDE_Android_Project.zip
          ls -la
          ls -la NIFTY_CE_PE_GUIDE_Android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: NIFTY_CE_PE_GUIDE_Android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NIFTY-CE-PE-GUIDE-APK
          path: NIFTY_CE_PE_GUIDE_Android/app/build/outputs/apk/debug/app-debug.apk
