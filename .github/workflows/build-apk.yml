name: Build NIFTY CE PE Guide APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Extract new Android project
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -o NIFTY_CE_PE_GUIDE_Android_v2.zip -d android-project

      - name: Locate Gradle project
        run: |
          echo "Looking for Android project..."
          find android-project -maxdepth 4 -name "settings.gradle.kts" -print
          find android-project -maxdepth 4 -name "build.gradle.kts" -print

      - name: Build APK
        run: |
          PROJECT_DIR=$(find android-project -name "settings.gradle.kts" -print -quit | xargs dirname)
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        if: success()
        run: |
          find android-project -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NIFTY-CE-PE-GUIDE-APK
          path: android-project/**/app/build/outputs/apk/debug/app-debug.apk
